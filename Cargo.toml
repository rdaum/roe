[workspace]
members = [
    "roe",
    "roe-core",
    "roe-terminal",
    "roe-vello",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/rdaum/roe"

[workspace.dependencies]
arboard = "3.6"
compio = { version = "=0.18.0", features = ["fs", "time"] }
crossterm = "0.29"
notify = "8.2"
ropey = "1.6"
similar = "3.1"
signal-hook = "0.4"
slotmap = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
