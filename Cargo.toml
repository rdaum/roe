[workspace]
members = [
    "roe",
    "roe-core",
    "roe-terminal",
    "roe-vello",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rdaum/roe"
rust-version = "1.96"

[workspace.dependencies]
arboard = "3.6"
compio = { version = "=0.18.0", features = ["fs", "time"] }
crossterm = "0.29"
mica-compiler = { git = "https://github.com/timbran-project/mica.git", rev = "dd7db6b04c9d780787f2b3ee4b15a468728624c9" }
mica-driver = { git = "https://github.com/timbran-project/mica.git", rev = "dd7db6b04c9d780787f2b3ee4b15a468728624c9", default-features = false, features = ["source-provider"] }
mica-external-http = { git = "https://github.com/timbran-project/mica.git", rev = "dd7db6b04c9d780787f2b3ee4b15a468728624c9" }
notify = "8.2"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.4"
similar = "3.1"
slotmap = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
