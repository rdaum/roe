[workspace]
members = [
    "roe",
    "roe-core",
    "roe-terminal",
    "roe-vello",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rdaum/roe"
rust-version = "1.96"

[workspace.dependencies]
arboard = "3.6"
compio = { version = "=0.18.0", features = ["fs", "time"] }
futures-util = "0.3"
crossterm = "0.29"
mica-compiler = { git = "https://github.com/timbran-project/mica.git" }
mica-driver = { git = "https://github.com/timbran-project/mica.git", default-features = false, features = ["source-provider"] }
mica-external-http = { git = "https://github.com/timbran-project/mica.git" }
notify = "8.2"
parley = "0.11"
pollster = "1.0"
ropey = "1.6"
serde = { version = "1.0", features = ["derive", "rc"] }
signal-hook = "0.4"
similar = "3.1"
slotmap = "1.1"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "=0.26.13"
tree-sitter-md = "=0.5.3"
tree-sitter-rust = "=0.24.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"
vello = "0.9"
winit = "0.30"
